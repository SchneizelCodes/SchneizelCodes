<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316" viewBox="0 0 1200 316" role="img" aria-labelledby="t d"><title id="t">PandeLoot — e-commerce · ai</title><desc id="d">A daily “loot drop” storefront for Filipino bakery treats, with Gemini-powered features, Google sign-in and live drops. Built with Next.js, TypeScript, Supabase, Gemini API. Status: Deployed on Vercel.</desc><rect width="1200" height="316" fill="#ffffff"/>
<style>.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
