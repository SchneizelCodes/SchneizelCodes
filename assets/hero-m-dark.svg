<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="t d"><title id="t">Joshua Manuel Camacho</title><desc id="d">Full-stack engineer and aspiring AI engineer from the Philippines. I build full-stack products, AI-powered tools, accessible learning apps and apps for Filipino users.</desc><rect width="480" height="560" fill="#0b0f17"/>
<style>
  .tw{animation:tw ease-in-out infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:.8}}
  .spin{animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .w{font:700 60px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:-1.5px;opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
  .ph{font:600 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;opacity:0;animation:swap 12s cubic-bezier(.22,1,.36,1) infinite backwards}
  @keyframes swap{0%{opacity:0;transform:translateY(14px)}4.17%{opacity:1;transform:none}21.67%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{animation:ring 2.2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nudge{animation:nudge 2.6s cubic-bezier(.22,1,.36,1) infinite}@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
.float{animation:float 8s ease-in-out infinite}@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rise{opacity:1}.ring{opacity:0}}
  @media (prefers-reduced-motion: reduce){.w,.ph:first-child{opacity:1}}
</style>
