<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Tindero — flagship project</title><desc id="d">Verified sellers, food ordering, a pre-loved marketplace and parcel sending in one app, with role-based access, passkey sign-in and ID checks. Built with TypeScript, React, Next.js, Supabase, Capacitor, WebAuthn. Live on desktop and mobile at tinderoph.vercel.app.</desc>
