<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">SCHNEIZEL.DEV — 3d · creative</title><desc id="d">My portfolio as a 3D solar system: each project is a planet you can fly to, built with React Three Fiber. Built with Next.js, React Three Fiber, Three.js, Zustand. Status: Portfolio.</desc>
