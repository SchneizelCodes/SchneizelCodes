.float{animation:float 8s ease-in-out infinite}@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rise{opacity:1}.ring{opacity:0}}.sheen{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,65%{transform:translateX(-120px)}100%{transform:translateX(484px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.sheen{opacity:0}}</style>
