<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">About me</title><desc id="d">FLAGSHIP · LIVE: Tindero. Shop, eat, sell and send in one Filipino app, live on desktop and mobile. EXPLORING: Private, local AI. Local LLMs with Ollama, retrieval (RAG) and AI features that respect user data. I CARE ABOUT: Secure by default. Row-level security, server-side checks, accessibility and tests. OPEN TO: Roles &amp; collabs. Full-stack and AI engineering roles, and collaborations.</desc><rect width="1200" height="430" fill="#0a0a0a"/>
