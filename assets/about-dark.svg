  .dotty{animation:dotty 1.3s ease-in-out infinite}
  @keyframes dotty{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.tile{opacity:1}.beam{opacity:0}.svc{opacity:0}}
</style>
