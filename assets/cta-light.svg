<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="t d"><title id="t">Let’s build something people use</title><desc id="d">Available for work. Full-stack and AI engineering roles and collaborations. Philippines, remote-friendly. Connect on LinkedIn.</desc><rect width="1200" height="176" fill="#ffffff"/>
