  .sheen{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,65%{transform:translateX(-120px)}100%{transform:translateX(360px)}}
  .arrow{animation:nudge 2.4s cubic-bezier(.22,1,.36,1) infinite}@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.word{opacity:1}.sheen{opacity:0}}
</style>
