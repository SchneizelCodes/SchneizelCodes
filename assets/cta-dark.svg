<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Let’s build something people use</title><desc id="d">Open to full-stack and AI engineering roles and collaborations. Based in the Philippines, working remotely.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#1f2832"/></pattern>
  <radialGradient id="glow" cx=".5" cy="1.1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .beam{animation:beam linear infinite}@keyframes beam{to{stroke-dashoffset:-100}}
  .h{font:700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3;letter-spacing:-1px}
  .s{font:400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#8b949e}
  .pill{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#4ade80}
  .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .word{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.word{opacity:1}.beam{opacity:0}}
</style>
<rect x=".5" y=".5" width="1199" height="199" rx="24" fill="#10161d" stroke="#232c36"/>
<rect x=".5" y=".5" width="1199" height="199" rx="24" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="199" rx="24" fill="url(#glow)"/>
<defs><linearGradient id="b111199" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.3333333333333333" stop-color="#a78bfa"/><stop offset="0.6666666666666666" stop-color="#e879f9"/><stop offset="1" stop-color="transparent"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="24" fill="none" stroke="url(#b111199)" stroke-width="2" pathLength="100"
