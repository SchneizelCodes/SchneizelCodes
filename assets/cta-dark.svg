<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Let’s build something people use</title><desc id="d">Available for work. Full-stack and AI engineering roles and collaborations. Philippines, remote-friendly. Say hello on GitHub.</desc>
