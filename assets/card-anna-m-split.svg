<svg xmlns="http://www.w3.org/2000/svg" width="480" height="370" viewBox="0 0 480 370" role="img" aria-labelledby="t d"><title id="t">Anna — local ai · privacy</title><desc id="d">A private AI companion that runs entirely on your PC through Ollama. Indexes only approved folders, remembers only what you allow, and suggests instead of editing. Built with Node.js, Ollama, RAG, Tailscale. Status: Runs 100% locally.</desc>
