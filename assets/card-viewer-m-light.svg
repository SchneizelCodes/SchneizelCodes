<svg xmlns="http://www.w3.org/2000/svg" width="480" height="341" viewBox="0 0 480 341" role="img" aria-labelledby="t d"><title id="t">GitHub Profile Viewer — developer tool</title><desc id="d">Search any GitHub user for live stats, a contribution heatmap with snake animation, top repositories and a language breakdown. Built with React, Vite, Tailwind CSS, GitHub API. Status: Live.</desc><rect width="480" height="341" fill="#ffffff"/>
<style>.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{animation:ring 2.2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nudge{animation:nudge 2.6s cubic-bezier(.22,1,.36,1) infinite}@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
.float{animation:float 8s ease-in-out infinite}@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rise{opacity:1}.ring{opacity:0}}</style>
<defs><pattern id="dots-k" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#ececec"/></pattern><linearGradient id="g-k" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#3b7e81"/><stop offset="0.4" stop-color="#006970"/><stop offset="0.65" stop-color="#095d65"/><stop offset="1" stop-color="#09555e"/></linearGradient><linearGradient id="cv-k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><clipPath id="c-k"><rect x="0" y="0" width="480" height="341" rx="24"/></clipPath></defs>
<g clip-path="url(#c-k)"><rect x="0" y="0" width="480" height="341" fill="url(#cv-k)"/><rect x="0" y="0" width="480" height="341" fill="url(#dots-k)"/><rect x="0" y="0" width="480" height="3" fill="url(#g-k)"/></g>
