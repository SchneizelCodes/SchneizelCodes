<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">PandeLoot — e-commerce · ai</title><desc id="d">A daily “loot drop” storefront for Filipino bakery treats, with Gemini-powered features, Google sign-in and live drops. Built with Next.js, TypeScript, Supabase, Gemini API. Status: Deployed on Vercel.</desc>
