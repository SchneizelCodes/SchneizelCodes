<svg xmlns="http://www.w3.org/2000/svg" width="480" height="130" viewBox="0 0 480 130" role="img" aria-labelledby="t d"><title id="t">03 Work: Selected work</title><desc id="d">Tap a card to open it</desc><rect width="480" height="130" fill="#0d1117"/>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#1e8286"/><stop offset="0.4" stop-color="#066a71"/><stop offset="0.65" stop-color="#025e67"/><stop offset="1" stop-color="#035660"/></linearGradient><clipPath id="lc0"><rect x="0" y="61.5" width="480" height="47.5"/></clipPath></defs>
<style>.seg{animation:seg 1.2s cubic-bezier(.22,1,.36,1) .2s backwards;transform-origin:0 0}@keyframes seg{from{transform:scaleX(0)}}
.line{animation:line 1s cubic-bezier(.22,1,.36,1) backwards}@keyframes line{from{opacity:0;transform:translateY(40px)}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{animation:ring 2.2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nudge{animation:nudge 2.6s cubic-bezier(.22,1,.36,1) infinite}@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
.float{animation:float 8s ease-in-out infinite}@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rise{opacity:1}.ring{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.line,.seg{animation:none}}</style>
<g class="rise"><text x="0" y="22" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.4"><tspan fill="#018690">03</tspan><tspan dx="12" fill="#ededed">WORK</tspan></text>
</g>
<rect x="0" y="36" width="480" height="1" fill="#262626"/>
<rect x="0" y="35.5" width="64" height="2" rx="1" fill="url(#g)" class="seg"/>
<g clip-path="url(#lc0)"><text x="-2" y="104" class="line" style="animation-delay:0.15s" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-2.1"><tspan fill="#ededed">SELECTED</tspan> <tspan fill="#018690">WORK</tspan></text></g>
</svg>