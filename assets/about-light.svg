  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .walk{animation:walk 6s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes walk{0%,15%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
  .unlock{animation:unlock 6s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes unlock{0%,45%{fill-opacity:0}60%,100%{fill-opacity:1}}
  .dotty{animation:dotty 1.3s ease-in-out infinite}
  @keyframes dotty{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.tile{opacity:1}.beam{opacity:0}.walk{stroke-dashoffset:0}.unlock{fill-opacity:1}}
</style>
