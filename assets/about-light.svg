<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">About me</title><desc id="d">BUILDING NOW: Kamayo. An interactive Filipino Sign Language learning system: a 100-level path, server-checked progress and row-level security. EXPLORING: Private, local AI. Local LLMs with Ollama, retrieval (RAG) and AI features that respect user data. I CARE ABOUT: Secure by default. Row-level security, server-side checks, accessibility and tests. OPEN TO: Roles &amp; collabs. Full-stack and AI engineering roles, and collaborations.</desc>
