<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">GitHub Profile Viewer — developer tool</title><desc id="d">Search any GitHub user for live stats, a contribution heatmap with snake animation, top repositories and a language breakdown. Built with React, Vite, Tailwind CSS, GitHub API. Status: Live.</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#e7eaee"/></pattern>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b45309" stop-opacity=".16"/><stop offset=".6" stop-color="#b45309" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .beam{animation:beam linear infinite}@keyframes beam{to{stroke-dashoffset:-100}}
  .k{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:2px;fill:#59636e}
  .n{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:2px;fill:#b45309}
  .title{font:700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#111827;letter-spacing:-.7px}
  .body{font:400 18.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e}
  .chip{font:500 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#111827}
  .st{font:600 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#111827}
  .cta{font:600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#111827}
  .wm{animation:float 9s ease-in-out infinite;transform-origin:455px 83px}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ring{animation:ring 2s ease-out infinite;transform-origin:46px 312px}
  @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
  .arrow{animation:nudge 2.4s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
  .sheen{animation:sheen 7s ease-in-out infinite;animation-delay:3.6s}
  @keyframes sheen{0%,70%{transform:translateX(-260px)}100%{transform:translateX(600px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.beam,.sheen,.ring{opacity:0}}
</style>
<clipPath id="clip"><rect width="540" height="350" rx="24"/></clipPath>
<g clip-path="url(#clip)">
  <rect width="540" height="350" fill="#fbfaf7"/>
  <rect width="540" height="350" fill="url(#dots)"/>
  <rect class="sheen" x="0" y="-40" width="70" height="430" fill="#ffffff" fill-opacity="0.7" transform="skewX(-18)"/>
  <g class="wm" opacity=".5"><g transform="translate(400 28) scale(4.583333333333333)" fill="none" stroke="#cfd5dd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" />
  <path d="m21 21-4.3-4.3" /></g></g>
</g>
<rect x=".5" y=".5" width="539" height="349" rx="24" fill="none" stroke="#e2e6eb"/>
<text x="30" y="44" class="n">05</text>
<text x="64" y="44" class="k">DEVELOPER TOOL</text>
<text x="30" y="86" class="title">GitHub Profile Viewer</text>
<text x="30" y="126" class="body">Search any GitHub user for live stats, a</text><text x="30" y="153" class="body">contribution heatmap with snake animation, top</text><text x="30" y="180" class="body">repositories and a language breakdown.</text>
<g transform="translate(0 242)"><rect x="30" y="0" width="64" height="30" rx="15" fill="#f3f4f6" stroke="#e2e6eb"/><text x="62" y="20" text-anchor="middle" class="chip">React</text><rect x="101" y="0" width="55.6" height="30" rx="15" fill="#f3f4f6" stroke="#e2e6eb"/><text x="128.8" y="20" text-anchor="middle" class="chip">Vite</text><rect x="163.6" y="0" width="122.8" height="30" rx="15" fill="#f3f4f6" stroke="#e2e6eb"/><text x="225" y="20" text-anchor="middle" class="chip">Tailwind CSS</text><rect x="293.4" y="0" width="106" height="30" rx="15" fill="#f3f4f6" stroke="#e2e6eb"/><text x="346.4" y="20" text-anchor="middle" class="chip">GitHub API</text></g>
<g>
  <rect x="30" y="296" width="75.6" height="32" rx="16" fill="#f3f4f6" stroke="#e2e6eb"/>
  <circle cx="46" cy="312" r="4.5" fill="#1a7f37" class="ring"/>
  <circle cx="46" cy="312" r="4.5" fill="#1a7f37" class="pulse"/>
  <text x="58" y="318" class="st">Live</text>
</g>
<text x="488" y="318" text-anchor="end" class="cta">Open live demo</text><g class="arrow"><g transform="translate(492 301) scale(0.8333333333333334)" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" /></g></g>
</svg>