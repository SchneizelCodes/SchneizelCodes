<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Kamayo — edtech · accessibility</title><desc id="d">Interactive Filipino Sign Language learning system with a 100-level path. Server-checked progress, row-level security on every record, and tested database rules. Built with React 19, TypeScript, Vite, Supabase, Vitest. Status: In development.</desc>
