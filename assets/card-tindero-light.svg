<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Tindero — marketplace</title><desc id="d">Pre-loved and community marketplace for the Philippines. Role-based access, passkey sign-in, ID scanning with OCR, and Android/iOS apps from one codebase. Built with TypeScript, React, Supabase, Capacitor, WebAuthn. Status: Web + mobile.</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#e3e8ee"/></pattern>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b45309" stop-opacity=".16"/><stop offset=".6" stop-color="#b45309" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .beam{animation:beam linear infinite}@keyframes beam{to{stroke-dashoffset:-100}}
  .k{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:2px;fill:#b45309}
  .n{font:500 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:2px;fill:#8c959f}
  .title{font:700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328;letter-spacing:-.7px}
  .body{font:400 18.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e}
  .chip{font:500 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#1f2328}
  .st{font:600 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#b45309}
  .cta{font:600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}
  .wm{animation:float 9s ease-in-out infinite;transform-origin:455px 83px}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ring{animation:ring 2s ease-out infinite;transform-origin:46px 312px}
  @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
  .arrow{animation:nudge 2.4s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
  .sheen{animation:sheen 7s ease-in-out infinite;animation-delay:0s}
  @keyframes sheen{0%,70%{transform:translateX(-260px)}100%{transform:translateX(600px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.beam,.sheen,.ring{opacity:0}}
</style>
<clipPath id="clip"><rect width="540" height="350" rx="24"/></clipPath>
<g clip-path="url(#clip)">
  <rect width="540" height="350" fill="#f8fafb"/>
  <rect width="540" height="350" fill="url(#dots)"/>
  <rect width="540" height="350" fill="url(#glow)"/>
  <rect class="sheen" x="0" y="-40" width="70" height="430" fill="#1f2328" fill-opacity=".035" transform="skewX(-18)"/>
  <g class="wm" opacity=".22"><g transform="translate(400 28) scale(4.583333333333333)" fill="none" stroke="#b45309" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
  <path d="M3 6h18" />
  <path d="M16 10a4 4 0 0 1-8 0" /></g></g>
</g>
<rect x=".5" y=".5" width="539" height="349" rx="24" fill="none" stroke="#dfe5eb"/>
<defs><linearGradient id="b11539" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="0.5" stop-color="#6d28d9"/><stop offset="1" stop-color="transparent"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="539" height="349" rx="24" fill="none" stroke="url(#b11539)" stroke-width="1.8" pathLength="100"
    stroke-dasharray="18 82" stroke-linecap="round" class="beam" style="animation-duration:9s;animation-delay:0s"/>
<text x="30" y="44" class="n">01</text>
<text x="64" y="44" class="k">MARKETPLACE</text>
<text x="30" y="86" class="title">Tindero</text>
<text x="30" y="126" class="body">Pre-loved and community marketplace for the</text><text x="30" y="153" class="body">Philippines. Role-based access, passkey sign-in,</text><text x="30" y="180" class="body">ID scanning with OCR, and Android/iOS apps from</text><text x="30" y="207" class="body">one codebase.</text>
<g transform="translate(0 242)"><rect x="30" y="0" width="106" height="30" rx="15" fill="#f1f4f7" stroke="#dfe5eb"/><text x="83" y="20" text-anchor="middle" class="chip">TypeScript</text><rect x="143" y="0" width="64" height="30" rx="15" fill="#f1f4f7" stroke="#dfe5eb"/><text x="175" y="20" text-anchor="middle" class="chip">React</text><rect x="214" y="0" width="89.2" height="30" rx="15" fill="#f1f4f7" stroke="#dfe5eb"/><text x="258.6" y="20" text-anchor="middle" class="chip">Supabase</text><rect x="310.2" y="0" width="97.6" height="30" rx="15" fill="#f1f4f7" stroke="#dfe5eb"/><text x="359" y="20" text-anchor="middle" class="chip">Capacitor</text><rect x="414.79999999999995" y="0" width="89.2" height="30" rx="15" fill="#f1f4f7" stroke="#dfe5eb"/><text x="459.4" y="20" text-anchor="middle" class="chip">WebAuthn</text></g>
<g>
  <rect x="30" y="296" width="142.8" height="32" rx="16" fill="#b45309" fill-opacity=".12" stroke="#b45309" stroke-opacity=".4"/>
  <circle cx="46" cy="312" r="4.5" fill="#b45309" class="ring"/>
  <circle cx="46" cy="312" r="4.5" fill="#b45309" class="pulse"/>
  <text x="58" y="318" class="st">Web + mobile</text>
</g>
<text x="488" y="318" text-anchor="end" class="cta">View repo</text><g class="arrow"><g transform="translate(492 301) scale(0.8333333333333334)" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" />
  <path d="M7 17 17 7" /></g></g>
</svg>