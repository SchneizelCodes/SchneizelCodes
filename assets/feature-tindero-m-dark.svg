<svg xmlns="http://www.w3.org/2000/svg" width="480" height="742" viewBox="0 0 480 742" role="img" aria-labelledby="t d"><title id="t">Tindero — flagship project</title><desc id="d">Verified sellers, food ordering, a pre-loved marketplace and parcel sending in one app, with role-based access, passkey sign-in and ID checks. Live on desktop and mobile at tinderoph.vercel.app.</desc><rect width="480" height="742" fill="#0d1117"/>
<style>.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
